name: flowershop
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter : ^10.7.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo2.png"

  adaptive_icon_background: "#E8E8EA"
  adaptive_icon_foreground : "assets/images/applogo2.png"


flutter:
  uses-material-design: true

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Bold.ttf
          weight: 800
        - asset: assets/fonts/Cinzel-Regular.ttf
          weight: 400

    - family: Cormorant
      fonts:
        - asset: assets/fonts/Cormorant-Bold.ttf
          weight: 800
        - asset: assets/fonts/Cormorant-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Cormorant-Regular.ttf
          weight: 400

  assets:
    - assets/images/